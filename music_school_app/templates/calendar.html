<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar • Music School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .calendar-day {
            transition: all 0.1s ease;
        }
        .calendar-day:hover {
            background-color: #f3e8ff;
            transform: scale(1.02);
        }
        .dark .calendar-day:hover {
            background-color: #312e81;
        }
        .activity-dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            display: inline-block;
            margin-right: 2px;
        }
    </style>
</head>
<body class="bg-[#eef0f2] text-[#1f2937] dark:bg-zinc-950 dark:text-zinc-200">
    <div class="max-w-5xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-semibold">Activity Calendar</h1>
                <p class="text-sm text-zinc-500 dark:text-zinc-400">{{ student.user.full_name if student else 'Your Calendar' }}</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="/dashboard/student" class="text-sm px-4 py-2 rounded-2xl border border-zinc-300 dark:border-zinc-700 hover:bg-white dark:hover:bg-zinc-900 transition-colors">← Back to Dashboard</a>
                <button onclick="toggleDarkMode()" class="px-3 py-2 text-sm rounded-2xl border border-zinc-300 dark:border-zinc-700">🌓</button>
            </div>
        </div>

        <!-- Month Navigation -->
        <div class="flex items-center justify-between mb-6">
            <button onclick="changeMonth(-1)" 
                    class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 hover:bg-zinc-50 dark:hover:bg-zinc-800">
                ← Previous
            </button>
            <h2 id="month-year" class="text-xl font-semibold"></h2>
            <button onclick="changeMonth(1)" 
                    class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 hover:bg-zinc-50 dark:hover:bg-zinc-800">
                Next →
            </button>
        </div>

        <!-- Calendar Grid -->
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-3xl p-6 shadow-sm">
            <!-- Day Headers -->
            <div class="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-medium text-zinc-500 dark:text-zinc-400">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-sm">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <p class="text-xs text-center text-zinc-400 dark:text-zinc-500 mt-4">Click on a day with activity to see details</p>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" onclick="if (event.target.id === 'detail-modal') closeModal()" 
         class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div onclick="event.stopImmediatePropagation()" 
             class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-3xl max-w-lg w-full mx-4 p-6">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 id="modal-date" class="text-xl font-semibold"></h3>
                    <p id="modal-summary" class="text-sm text-zinc-500 dark:text-zinc-400"></p>
                </div>
                <button onclick="closeModal()" class="text-2xl leading-none text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300">&times;</button>
            </div>
            
            <div id="modal-content" class="space-y-4 max-h-[60vh] overflow-auto pr-2">
                <!-- Populated dynamically -->
            </div>
            
            <div class="mt-6 pt-4 border-t border-zinc-100 dark:border-zinc-800 flex justify-end">
                <button onclick="closeModal()" 
                        class="px-5 py-2 text-sm rounded-2xl border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-50 dark:hover:bg-zinc-800">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        // Tailwind dark mode setup
        function initDarkMode() {
            if (localStorage.getItem('darkMode') === 'true' || 
                (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        }
        
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
        }
        
        initDarkMode();

        // Calendar data from server (embedded)
        const calendarData = {{ calendar_data | tojson }};
        let currentDate = new Date();

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('month-year').textContent = 
                currentDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'h-20 border border-transparent';
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayData = calendarData[dateStr] || { practice: [], assignments: [], parent_activity: [] };
                
                const hasActivity = dayData.practice.length > 0 || dayData.assignments.length > 0 || dayData.parent_activity.length > 0;
                
                const cell = document.createElement('div');
                cell.className = `h-20 border border-zinc-200 dark:border-zinc-700 rounded-2xl p-2 flex flex-col ${hasActivity ? 'cursor-pointer calendar-day bg-white dark:bg-zinc-900' : 'bg-zinc-50 dark:bg-zinc-950 opacity-60'}`;
                
                if (hasActivity) {
                    cell.onclick = () => showDayDetail(dateStr, dayData);
                }

                cell.innerHTML = `
                    <div class="font-medium text-sm mb-1">${day}</div>
                    <div class="flex flex-wrap gap-1 mt-auto">
                        ${dayData.practice.length > 0 ? `<span class="activity-dot bg-[#838bc5]" title="Practice"></span>` : ''}
                        ${dayData.assignments.length > 0 ? `<span class="activity-dot bg-[#231677]" title="Assignment"></span>` : ''}
                        ${dayData.parent_activity.length > 0 ? `<span class="activity-dot bg-amber-400" title="Parent activity"></span>` : ''}
                    </div>
                `;
                
                grid.appendChild(cell);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function showDayDetail(dateStr, dayData) {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            const dateEl = document.getElementById('modal-date');
            const summaryEl = document.getElementById('modal-summary');

            dateEl.textContent = new Date(dateStr).toLocaleDateString('en-US', { 
                weekday: 'long', month: 'long', day: 'numeric' 
            });

            let totalItems = dayData.practice.length + dayData.assignments.length + dayData.parent_activity.length;
            summaryEl.textContent = `${totalItems} activity${totalItems !== 1 ? 'ies' : ''} on this day`;

            content.innerHTML = '';

            // Practice logs
            if (dayData.practice.length > 0) {
                const section = document.createElement('div');
                section.innerHTML = `<div class="font-semibold text-[#231677] mb-2 flex items-center gap-2"><span class="activity-dot bg-[#838bc5] w-3 h-3"></span> Practice Logged</div>`;
                
                dayData.practice.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'ml-5 mb-2 text-sm bg-zinc-50 dark:bg-zinc-800 p-3 rounded-2xl';
                    div.innerHTML = `
                        <div class="font-medium">${item.minutes} minutes</div>
                        ${item.notes ? `<div class="text-xs text-zinc-500 mt-0.5">${item.notes}</div>` : ''}
                    `;
                    section.appendChild(div);
                });
                content.appendChild(section);
            }

            // Assignments
            if (dayData.assignments.length > 0) {
                const section = document.createElement('div');
                section.innerHTML = `<div class="font-semibold text-[#231677] mb-2 mt-4 flex items-center gap-2"><span class="activity-dot bg-[#231677] w-3 h-3"></span> Assignments</div>`;
                
                dayData.assignments.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'ml-5 mb-2 text-sm bg-zinc-50 dark:bg-zinc-800 p-3 rounded-2xl';
                    div.innerHTML = `
                        <div class="font-medium">${item.title}</div>
                        <div class="text-xs text-zinc-500 mt-0.5 line-clamp-2">${item.description}</div>
                    `;
                    section.appendChild(div);
                });
                content.appendChild(section);
            }

            // Parent activity
            if (dayData.parent_activity.length > 0) {
                const section = document.createElement('div');
                section.innerHTML = `<div class="font-semibold text-amber-600 mb-2 mt-4 flex items-center gap-2"><span class="activity-dot bg-amber-400 w-3 h-3"></span> Parent Activity</div>`;
                
                dayData.parent_activity.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'ml-5 mb-2 text-sm bg-zinc-50 dark:bg-zinc-800 p-3 rounded-2xl';
                    div.innerHTML = `
                        <div class="font-medium">${item.type}</div>
                        <div class="text-xs text-zinc-500 mt-0.5">${item.content}</div>
                    `;
                    section.appendChild(div);
                });
                content.appendChild(section);
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // Initialize
        window.onload = function() {
            initDarkMode();
            renderCalendar();
        }
    </script>
</body>
</html>
