<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account • Music School</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-lg">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-600 rounded-2xl mb-4">
                    <span class="text-3xl">🎵</span>
                </div>
                <h1 class="text-3xl font-semibold tracking-tight">Create Your Account</h1>
                <p class="text-zinc-400 mt-2">Join the music school portal</p>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-8">
                {% if error %}
                <div class="mb-4 p-3 bg-red-950 border border-red-900 text-red-400 rounded-2xl text-sm">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/register" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">I am a...</label>
                        <select name="role" required onchange="toggleFields(this.value)"
                                class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-white">
                            <option value="student">Student</option>
                            <option value="parent">Parent / Guardian</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Full Name</label>
                        <input type="text" name="full_name" required 
                               class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Email Address</label>
                        <input type="email" name="email" required 
                               class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Password</label>
                        <input type="password" name="password" required minlength="6"
                               class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-white">
                    </div>

                    <!-- Student-specific fields -->
                    <div id="student-fields">
                        <div>
                            <label class="block text-sm font-medium text-zinc-400 mb-1.5">Lesson Day & Time (optional)</label>
                            <input type="text" name="lesson_day" placeholder="e.g. Monday 4:30 PM"
                                   class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-white">
                        </div>
                    </div>

                    <!-- Parent-specific fields -->
                    <div id="parent-fields" class="hidden">
                        <div>
                            <label class="block text-sm font-medium text-zinc-400 mb-1.5">Link to existing student (optional)</label>
                            <select name="link_student_id" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-white">
                                <option value="">-- Select a student (or leave blank) --</option>
                                {% for s in students %}
                                <option value="{{ s.id }}">{{ s.user.full_name }} ({{ s.lesson_day }})</option>
                                {% endfor %}
                            </select>
                            <p class="text-xs text-zinc-500 mt-1">You can also ask the school office to link you later.</p>
                        </div>
                    </div>

                    <button type="submit" 
                            class="w-full bg-emerald-600 hover:bg-emerald-500 transition-colors text-white font-medium py-3.5 rounded-2xl mt-2">
                        Create Account
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a href="/login" class="text-sm text-emerald-400 hover:underline">Already have an account? Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleFields(role) {
            const studentFields = document.getElementById('student-fields');
            const parentFields = document.getElementById('parent-fields');
            
            if (role === 'student') {
                studentFields.classList.remove('hidden');
                parentFields.classList.add('hidden');
            } else {
                studentFields.classList.add('hidden');
                parentFields.classList.remove('hidden');
            }
        }
        
        // Initialize
        window.onload = function() {
            toggleFields('student');
        }
    </script>
</body>
</html>
